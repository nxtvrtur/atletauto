<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомобиль — Атлет-Авто</title>
  <link rel="icon" href="images/tild6436-3536-4334-b835-393235303734_favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
:root{--or:#2B5CE6;--or-dim:rgba(43,92,230,.12);--or-glow:0 0 32px rgba(43,92,230,.32);--bg:#0D0B0A;--bg-r:#131211;--b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);--w:#FFF;--m:rgba(255,255,255,.55);--m2:rgba(255,255,255,.28);--fd:'Barlow Condensed',sans-serif;--fm:'IBM Plex Mono',monospace;--fb:'Outfit',sans-serif;--r:12px;--r2:20px;--ease:cubic-bezier(.4,0,.2,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fb);background:var(--bg);color:var(--w);overflow-x:hidden;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{background:none;border:none;cursor:pointer;font-family:var(--fb);color:inherit;}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}
/* nav */
.nav{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;background:rgba(13,11,10,.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.nav-logo img{height:30px;}
.nav-wa{display:flex;align-items:center;gap:8px;padding:9px 18px;background:var(--or);color:#fff;font-weight:600;font-size:13px;border-radius:7px;}
.nav-wa svg{width:15px;height:15px;}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--m);padding:28px 0 22px;transition:color .2s;}
.back:hover{color:var(--w);}
.back svg{width:16px;height:16px;}
/* layout */
.wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:48px;align-items:start;padding-bottom:80px;}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;gap:24px;padding-bottom:48px;}
  .info{position:static;}
  .back{padding:18px 0 14px;}
  .i-name{font-size:clamp(26px,7vw,40px);}
  .i-price{font-size:28px;}
  .btn-primary,.btn-ghost{padding:14px 20px;font-size:14px;}
  .gal-arrow{width:36px;height:36px;}
  .gal-arrow svg{width:16px;height:16px;}
  .gal-prev{left:10px;}.gal-next{right:10px;}
  .gal-thumb{flex:0 0 72px;height:48px;}
  .gal-thumbs{gap:6px;margin-top:8px;}
  .i-specs{margin-bottom:20px;}
  .i-trust{margin-top:16px;}
}
/* gallery */
.gal-main{position:relative;border-radius:var(--r2);overflow:hidden;border:1px solid var(--b);background:var(--bg-r);aspect-ratio:4/3;max-height:460px;}
.gal-main img{width:100%;height:100%;object-fit:contain;}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(13,11,10,.6);backdrop-filter:blur(8px);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,border-color .2s;}
.gal-arrow:hover{background:var(--or);border-color:transparent;}
.gal-arrow svg{width:20px;height:20px;}
.gal-prev{left:14px;}.gal-next{right:14px;}
.gal-counter{position:absolute;bottom:14px;right:14px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:#fff;background:rgba(13,11,10,.7);backdrop-filter:blur(8px);border:1px solid var(--b2);padding:5px 11px;border-radius:100px;}
.gal-thumbs{display:flex;gap:9px;margin-top:12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;}
.gal-thumbs::-webkit-scrollbar{height:5px;}.gal-thumbs::-webkit-scrollbar-thumb{background:var(--b2);border-radius:9px;}
.gal-thumb{flex:0 0 96px;height:64px;border-radius:9px;overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.55;transition:opacity .2s,border-color .2s;}
.gal-thumb img{width:100%;height:100%;object-fit:cover;}
.gal-thumb.active{opacity:1;border-color:var(--or);}
.gal-none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(150deg,#16203a 0%,var(--bg-r) 100%);}
.gal-none svg{width:64px;height:64px;color:rgba(43,92,230,.55);}
.gal-none span{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m2);}
/* info */
.info{position:sticky;top:88px;}
.i-badge{display:inline-block;font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--or);border:1px solid rgba(43,92,230,.4);border-radius:100px;padding:5px 13px;margin-bottom:18px;}
.i-name{font-family:var(--fd);font-size:clamp(34px,4.5vw,52px);font-weight:900;text-transform:uppercase;line-height:.98;margin-bottom:16px;}
.i-price{font-family:var(--fd);font-size:34px;font-weight:900;margin-bottom:4px;}
.i-price span{font-family:var(--fb);font-size:14px;font-weight:400;color:var(--m);}
.i-price.req{font-size:22px;color:var(--m);font-family:var(--fb);font-weight:500;}
.i-note-price{font-size:12px;color:var(--m);margin-bottom:26px;}
.i-specs{border-top:1px solid var(--b);margin-bottom:28px;}
.i-row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--b);font-size:14px;}
.i-row .k{color:var(--m);}.i-row .v{color:var(--w);font-weight:500;text-align:right;}
.i-cta{display:flex;flex-direction:column;gap:11px;}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;background:var(--or);color:#fff;font-weight:600;font-size:15px;border-radius:8px;transition:background .2s,transform .2s,box-shadow .2s;}
.btn-primary:hover{background:#4674f0;transform:translateY(-2px);box-shadow:0 14px 40px rgba(43,92,230,.4);}
.btn-primary svg{width:18px;height:18px;}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 28px;border:1px solid var(--b2);color:var(--w);font-weight:500;font-size:15px;border-radius:8px;transition:border-color .2s,background .2s;}
.btn-ghost:hover{border-color:var(--or);background:var(--or-dim);}
.btn-ghost svg{width:17px;height:17px;}
.i-trust{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
.i-trust li{display:flex;align-items:center;gap:11px;font-size:13px;color:rgba(255,255,255,.78);list-style:none;}
.i-trust svg{width:18px;height:18px;color:var(--or);flex-shrink:0;}
.notfound{padding:120px 0;text-align:center;}
.notfound h1{font-family:var(--fd);font-size:48px;font-weight:900;text-transform:uppercase;margin-bottom:16px;}
.notfound a{color:var(--or);}
  </style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a href="index.html" class="nav-logo"><img src="images/tild6366-6165-4432-b831-663033633230_LOGO.PNG" alt="Атлет-Авто"></a>
  <a href="https://vk.me/atletauto" target="_blank" class="nav-wa">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720"><path fill="currentColor" d="M350.4,9.6C141.8,20.5,4.1,184.1,12.8,390.4c3.8,90.3,40.1,168,48.7,253.7,2.2,22.2-4.2,49.6,21.4,59.3,31.5,11.9,79.8-8.1,106.2-26.4,9-6.1,17.6-13.2,24.2-22,27.3,18.1,53.2,35.6,85.7,43.4,143.1,34.3,299.9-44.2,369.6-170.3C799.6,291.2,622.5-4.6,350.4,9.6h0ZM269.4,504c-11.3,8.8-22.2,20.8-34.7,27.7-18.1,9.7-23.7-.4-30.5-16.4-21.4-50.9-24-137.6-11.5-190.9,16.8-72.5,72.9-136.3,150-143.1,78-6.9,150.4,32.7,183.1,104.2,72.4,159.1-112.9,316.2-256.4,218.6h0Z"/></svg>
    Max
  </a>
</div></header>

<div class="container">
  <a href="index.html#catalog" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Назад в каталог</a>
  <div id="app"></div>
</div>

<script src="cars.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id');
  var car=(window.CARS||[]).find(function(c){return c.slug===id;});
  var app=document.getElementById('app');
  if(!car){ app.innerHTML='<div class="notfound"><h1>Авто не найдено</h1><a href="index.html#catalog">← Вернуться в каталог</a></div>'; document.title='Не найдено — Атлет-Авто'; return; }
  document.title=car.name+' — Атлет-Авто';

  var imgs=[]; for(var i=1;i<=car.photos;i++){ imgs.push('images/cars/'+car.slug+'/'+('0'+i).slice(-2)+'.jpg'); }
  var priceLabel = car.price ? (car.price).toLocaleString('ru-RU')+' ₽' : 'Цена по запросу';
  var priceHtml = car.price ? '<div class="i-price"><span>от</span> '+(car.price).toLocaleString('ru-RU')+' ₽</div>' : '<div class="i-price req">Цена по запросу</div>';

  var galleryHtml;
  if(imgs.length){
    var thumbs=imgs.map(function(s,i){return '<div class="gal-thumb'+(i===0?' active':'')+'" data-i="'+i+'"><img src="'+s+'" loading="lazy" alt=""></div>';}).join('');
    galleryHtml='<div class="gal-main"><img id="galImg" src="'+imgs[0]+'" alt="'+car.name+'">'
      +(imgs.length>1?'<button class="gal-arrow gal-prev" id="galPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button><button class="gal-arrow gal-next" id="galNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button><div class="gal-counter" id="galCount">1 / '+imgs.length+'</div>':'')
      +'</div>'+(imgs.length>1?'<div class="gal-thumbs" id="galThumbs">'+thumbs+'</div>':'');
  } else if(car.cover) {
    galleryHtml='<div class="gal-main"><img id="galImg" src="'+car.cover+'" alt="'+car.name+'"></div>';
  } else {
    galleryHtml='<div class="gal-main gal-none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.6-4.8A2 2 0 018.5 7h7a2 2 0 011.9 1.2L19 13"/><path d="M3 13h18v4a1 1 0 01-1 1h-1a1 1 0 01-1-1v-1H6v1a1 1 0 01-1 1H4a1 1 0 01-1-1v-4z"/><circle cx="7.5" cy="15.5" r="1"/><circle cx="16.5" cy="15.5" r="1"/></svg><span>Фото по запросу</span></div>';
  }

  var specRows=car.specs.map(function(p){return '<div class="i-row"><span class="k">'+p[0]+'</span><span class="v">'+p[1]+'</span></div>';}).join('');
  var waMsg='Здравствуйте! Интересует '+car.name+' ('+priceLabel+'). Расскажите подробнее?';
  var maxHref='https://vk.me/atletauto';

  app.innerHTML='<div class="wrap">'
    +'<div class="gallery">'+galleryHtml+'</div>'
    +'<div class="info">'
      +'<span class="i-badge">'+car.badge+'</span>'
      +'<h1 class="i-name">'+car.name+'</h1>'
      +priceHtml
      +(car.price?'<div class="i-note-price">Под ключ во Владивостоке · таможня и ЭПТС включены</div>':'<div class="i-note-price">Рассчитаем полную стоимость под ключ по запросу</div>')
      +'<div class="i-specs">'+specRows+'</div>'
      +'<div class="i-cta">'
        +'<a class="btn-primary" href="'+maxHref+'" target="_blank"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 720\"><path fill=\"currentColor\" d=\"M350.4,9.6C141.8,20.5,4.1,184.1,12.8,390.4c3.8,90.3,40.1,168,48.7,253.7,2.2,22.2-4.2,49.6,21.4,59.3,31.5,11.9,79.8-8.1,106.2-26.4,9-6.1,17.6-13.2,24.2-22,27.3,18.1,53.2,35.6,85.7,43.4,143.1,34.3,299.9-44.2,369.6-170.3C799.6,291.2,622.5-4.6,350.4,9.6h0ZM269.4,504c-11.3,8.8-22.2,20.8-34.7,27.7-18.1,9.7-23.7-.4-30.5-16.4-21.4-50.9-24-137.6-11.5-190.9,16.8-72.5,72.9-136.3,150-143.1,78-6.9,150.4,32.7,183.1,104.2,72.4,159.1-112.9,316.2-256.4,218.6h0Z\"/></svg>Написать в Max</a>'
        +'<a class="btn-ghost" href="tel:+78006001838"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>Позвонить · 8 800 600-18-38</a>'
      +'</div>'
      +'<ul class="i-trust">'
        +'<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Договор с ООО «АТЛЕТ АВТО», фиксированная цена</li>'
        +'<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Проверка ЛКП и техники с фотоотчётом</li>'
        +'<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Доставка по всей России</li>'
      +'</ul>'
    +'</div>'
  +'</div>';

  // gallery interactions
  if(imgs.length>1){
    var idx=0, main=document.getElementById('galImg'), count=document.getElementById('galCount'), thumbsEl=document.getElementById('galThumbs');
    function show(n){ idx=(n+imgs.length)%imgs.length; main.src=imgs[idx]; count.textContent=(idx+1)+' / '+imgs.length;
      thumbsEl.querySelectorAll('.gal-thumb').forEach(function(t,i){t.classList.toggle('active',i===idx);});
      var act=thumbsEl.querySelector('.gal-thumb.active'); if(act)act.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'}); }
    document.getElementById('galPrev').onclick=function(){show(idx-1);};
    document.getElementById('galNext').onclick=function(){show(idx+1);};
    thumbsEl.querySelectorAll('.gal-thumb').forEach(function(t){t.onclick=function(){show(+t.dataset.i);};});
    document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1);});
  }
})();
</script>
</body>
</html>
