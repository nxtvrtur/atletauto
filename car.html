<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автомобиль — Атлет-Авто</title>
  <link rel="icon" href="images/tild6436-3536-4334-b835-393235303734_favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
:root{--or:#2B5CE6;--or-dim:rgba(43,92,230,.12);--or-glow:0 0 32px rgba(43,92,230,.32);--bg:#0D0B0A;--bg-r:#131211;--b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);--w:#FFF;--m:rgba(255,255,255,.55);--m2:rgba(255,255,255,.28);--fd:'Barlow Condensed',sans-serif;--fm:'IBM Plex Mono',monospace;--fb:'Outfit',sans-serif;--r:12px;--r2:20px;--ease:cubic-bezier(.4,0,.2,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fb);background:var(--bg);color:var(--w);overflow-x:hidden;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{background:none;border:none;cursor:pointer;font-family:var(--fb);color:inherit;}
.container{max-width:1200px;margin:0 auto;padding:0 20px;}

/* nav */
.nav{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;background:rgba(13,11,10,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.nav-logo img{height:28px;}
.nav-wa{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--or);color:#fff;font-weight:600;font-size:13px;border-radius:7px;white-space:nowrap;}
.nav-wa svg{width:15px;height:15px;flex-shrink:0;}

.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--m);padding:22px 0 18px;transition:color .2s;}
.back:hover{color:var(--w);}
.back svg{width:16px;height:16px;flex-shrink:0;}

/* ── 2-column layout ── */
.wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:start;padding-bottom:80px;}

/* gallery column */
.gallery{min-width:0;}

/* main image */
.gal-main{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--b);background:var(--bg-r);aspect-ratio:4/3;width:100%;}
.gal-main img{width:100%;height:100%;object-fit:contain;}

/* arrows */
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(13,11,10,.65);backdrop-filter:blur(8px);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,border-color .2s;z-index:2;}
.gal-arrow:hover{background:var(--or);border-color:transparent;}
.gal-arrow svg{width:18px;height:18px;}
.gal-prev{left:12px;}.gal-next{right:12px;}

/* counter */
.gal-counter{position:absolute;bottom:12px;right:12px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:#fff;background:rgba(13,11,10,.72);backdrop-filter:blur(8px);border:1px solid var(--b2);padding:4px 10px;border-radius:100px;z-index:2;}

/* thumbnails — fixed-height horizontal scroll, small squares */
.gal-thumbs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--b2) transparent;}
.gal-thumbs::-webkit-scrollbar{height:4px;}
.gal-thumbs::-webkit-scrollbar-thumb{background:var(--b2);border-radius:9px;}
.gal-thumb{flex:0 0 72px;height:50px;border-radius:7px;overflow:hidden;border:2px solid transparent;cursor:pointer;opacity:.5;transition:opacity .18s,border-color .18s;}
.gal-thumb img{width:100%;height:100%;object-fit:cover;}
.gal-thumb.active{opacity:1;border-color:var(--or);}

/* no photo */
.gal-none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(150deg,#16203a 0%,var(--bg-r) 100%);}
.gal-none svg{width:56px;height:56px;color:rgba(43,92,230,.55);}
.gal-none span{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m2);}

/* info column — sticky, scrollable if tall */
.info{min-width:0;position:sticky;top:72px;max-height:calc(100vh - 80px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-right:2px;}
.info::-webkit-scrollbar{display:none;}

.i-badge{display:inline-block;font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--or);border:1px solid rgba(43,92,230,.4);border-radius:100px;padding:5px 13px;margin-bottom:16px;}
.i-name{font-family:var(--fd);font-size:clamp(30px,3.8vw,50px);font-weight:900;text-transform:uppercase;line-height:.96;margin-bottom:14px;overflow-wrap:break-word;word-break:break-word;}
.i-price{font-family:var(--fd);font-size:clamp(26px,3vw,36px);font-weight:900;margin-bottom:4px;}
.i-price span{font-family:var(--fb);font-size:14px;font-weight:400;color:var(--m);}
.i-price.req{font-size:20px;color:var(--m);font-family:var(--fb);font-weight:500;}
.i-note-price{font-size:12px;color:var(--m);margin-bottom:22px;line-height:1.5;}
.i-specs{border-top:1px solid var(--b);margin-bottom:24px;}
.i-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--b);font-size:13px;}
.i-row .k{color:var(--m);white-space:nowrap;}
.i-row .v{color:var(--w);font-weight:500;text-align:right;overflow-wrap:break-word;word-break:break-word;}
.i-cta{display:flex;flex-direction:column;gap:10px;}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;background:var(--or);color:#fff;font-weight:600;font-size:15px;border-radius:8px;transition:background .2s,transform .2s,box-shadow .2s;width:100%;}
.btn-primary:hover{background:#4674f0;transform:translateY(-2px);box-shadow:0 12px 36px rgba(43,92,230,.4);}
.btn-primary svg{width:17px;height:17px;flex-shrink:0;}
.btn-ghost{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 24px;border:1px solid var(--b2);color:var(--w);font-weight:500;font-size:14px;border-radius:8px;transition:border-color .2s,background .2s;width:100%;}
.btn-ghost:hover{border-color:var(--or);background:var(--or-dim);}
.btn-ghost svg{width:16px;height:16px;flex-shrink:0;}
.i-trust{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
.i-trust li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:rgba(255,255,255,.78);list-style:none;line-height:1.4;}
.i-trust svg{width:16px;height:16px;color:var(--or);flex-shrink:0;margin-top:1px;}

.notfound{padding:120px 0;text-align:center;}
.notfound h1{font-family:var(--fd);font-size:48px;font-weight:900;text-transform:uppercase;margin-bottom:16px;}
.notfound a{color:var(--or);}

/* ── Tablet 1080→720 ── */
@media(max-width:1080px){
  .wrap{gap:28px;}
  .gal-thumb{flex:0 0 62px;height:44px;}
}

/* ── Mobile ≤720 ── */
@media(max-width:720px){
  .container{padding:0 16px;}
  .back{padding:16px 0 12px;}
  .wrap{grid-template-columns:1fr;gap:0;padding-bottom:40px;}
  .gallery{margin-bottom:0;}
  .info{
    position:static;
    max-height:none;
    overflow:visible;
    margin-top:20px;
  }
  /* gallery on mobile: shorter */
  .gal-main{aspect-ratio:16/10;border-radius:12px;}
  .gal-arrow{width:34px;height:34px;}
  .gal-arrow svg{width:15px;height:15px;}
  .gal-prev{left:8px;}.gal-next{right:8px;}
  .gal-counter{font-size:10px;padding:3px 9px;bottom:9px;right:9px;}
  /* thumbnails mobile: 6 per row, 2 rows for 12 photos */
  .gal-thumbs{flex-wrap:wrap;overflow-x:hidden;overflow-y:visible;max-height:none;padding-bottom:0;gap:5px;margin-top:8px;}
  .gal-thumb{flex:0 0 calc(16.666% - 5px);min-width:44px;height:42px;border-radius:6px;}
  /* name & price */
  .i-name{font-size:clamp(28px,8vw,44px);}
  .i-price{font-size:28px;}
  .i-note-price{margin-bottom:18px;}
  .i-specs{margin-bottom:18px;}
  .btn-primary,.btn-ghost{padding:14px 20px;font-size:14px;}
  .i-trust{margin-top:16px;}
}

/* ── Tiny ≤380 ── */
@media(max-width:380px){
  .gal-thumb{flex:0 0 calc(16.666% - 4px);min-width:40px;height:36px;gap:4px;}
  .i-name{font-size:clamp(24px,8vw,36px);}
}
  </style>
<!-- Pixel DataLeads -->
<script type="text/javascript">
(function (d, w) {
  var n = d.getElementsByTagName("script")[0],
      s = d.createElement("script");
  s.type = "text/javascript";
  s.async = true;
  s.src = "https://gstad.ru/index.php?ref="+d.referrer+"&page=" + encodeURIComponent(w.location.href);
  n.parentNode.insertBefore(s, n);
})(document, window);
</script>
<!-- /Pixel DataLeads -->
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a href="index.html" class="nav-logo"><img src="images/tild6366-6165-4432-b831-663033633230_LOGO.PNG" alt="Атлет-Авто"></a>
  <a href="https://vk.me/atletauto" target="_blank" class="nav-wa">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.684 0H8.316C1.592 0 0 1.592 0 8.316v7.368C0 22.408 1.592 24 8.316 24h7.368C22.408 24 24 22.408 24 15.684V8.316C24 1.592 22.408 0 15.684 0zm3.692 17.123h-1.744c-.66 0-.862-.525-2.049-1.714-1.033-1.01-1.49-1.135-1.744-1.135-.356 0-.458.101-.458.593v1.566c0 .423-.135.677-1.253.677-1.845 0-3.896-1.118-5.336-3.202C4.624 10.857 4.03 8.57 4.03 8.096c0-.254.101-.491.593-.491h1.744c.44 0 .61.203.779.677.863 2.49 2.303 4.675 2.896 4.675.22 0 .322-.101.322-.66V9.721c-.068-1.186-.695-1.287-.695-1.71 0-.203.169-.407.44-.407h2.744c.372 0 .508.203.508.643v3.473c0 .372.169.508.271.508.22 0 .407-.136.813-.542 1.253-1.405 2.151-3.574 2.151-3.574.119-.254.322-.491.762-.491h1.744c.525 0 .643.27.525.643-.22 1.017-2.354 4.031-2.354 4.031-.186.305-.254.44 0 .779.186.254.796.779 1.203 1.253.745.847 1.32 1.558 1.473 2.049.17.49-.085.745-.576.745z"/></svg>
    Max
  </a>
</div></header>

<div class="container">
  <a href="index.html#catalog" class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Назад в каталог</a>
  <div id="app"></div>
</div>

<script src="cars.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id');
  var car=(window.CARS||[]).find(function(c){return c.slug===id;});
  var app=document.getElementById('app');
  if(!car){ app.innerHTML='<div class="notfound"><h1>Авто не найдено</h1><a href="index.html#catalog">← Вернуться в каталог</a></div>'; document.title='Не найдено — Атлет-Авто'; return; }
  document.title=car.name+' — Атлет-Авто';

  var imgs=[]; for(var i=1;i<=car.photos;i++){ imgs.push('images/cars/'+car.slug+'/'+('0'+i).slice(-2)+'.jpg'); }
  var priceLabel = car.price ? (car.price).toLocaleString('ru-RU')+' ₽' : 'Цена по запросу';
  var priceHtml = car.price ? '<div class="i-price"><span>от</span> '+(car.price).toLocaleString('ru-RU')+' ₽</div>' : '<div class="i-price req">Цена по запросу</div>';

  var galleryHtml;
  if(imgs.length){
    var thumbs=imgs.map(function(s,i){return '<div class="gal-thumb'+(i===0?' active':'')+'" data-i="'+i+'"><img src="'+s+'" loading="lazy" alt=""></div>';}).join('');
    galleryHtml='<div class="gal-main"><img id="galImg" src="'+imgs[0]+'" alt="'+car.name+'">'
      +(imgs.length>1?'<button class="gal-arrow gal-prev" id="galPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button><button class="gal-arrow gal-next" id="galNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button><div class="gal-counter" id="galCount">1 / '+imgs.length+'</div>':'')
      +'</div>'+(imgs.length>1?'<div class="gal-thumbs" id="galThumbs">'+thumbs+'</div>':'');
  } else if(car.cover) {
    galleryHtml='<div class="gal-main"><img id="galImg" src="'+car.cover+'" alt="'+car.name+'"></div>';
  } else {
    galleryHtml='<div class="gal-main gal-none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.6-4.8A2 2 0 018.5 7h7a2 2 0 011.9 1.2L19 13"/><path d="M3 13h18v4a1 1 0 01-1 1h-1a1 1 0 01-1-1v-1H6v1a1 1 0 01-1 1H4a1 1 0 01-1-1v-4z"/><circle cx="7.5" cy="15.5" r="1"/><circle cx="16.5" cy="15.5" r="1"/></svg><span>Фото по запросу</span></div>';
  }

  var specRows=car.specs.map(function(p){return '<div class="i-row"><span class="k">'+p[0]+'</span><span class="v">'+p[1]+'</span></div>';}).join('');
  var waMsg='Здравствуйте! Интересует '+car.name+' ('+priceLabel+'). Расскажите подробнее?';
  var maxHref='https://vk.me/atletauto';

  app.innerHTML='<div class="wrap">'
    +'<div class="gallery">'+galleryHtml+'</div>'
    +'<div class="info">'
      +'<span class="i-badge">'+car.badge+'</span>'
      +'<h1 class="i-name">'+car.name+'</h1>'
      +priceHtml
      +(car.price?'<div class="i-note-price">Под ключ во Владивостоке · таможня и ЭПТС включены</div>':'<div class="i-note-price">Рассчитаем полную стоимость под ключ по запросу</div>')
      +'<div class="i-specs">'+specRows+'</div>'
      +'<div class="i-cta">'
        +'<a class="btn-primary" href="'+maxHref+'" target="_blank"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M15.684 0H8.316C1.592 0 0 1.592 0 8.316v7.368C0 22.408 1.592 24 8.316 24h7.368C22.408 24 24 22.408 24 15.684V8.316C24 1.592 22.408 0 15.684 0zm3.692 17.123h-1.744c-.66 0-.862-.525-2.049-1.714-1.033-1.01-1.49-1.135-1.744-1.135-.356 0-.458.101-.458.593v1.566c0 .423-.135.677-1.253.677-1.845 0-3.896-1.118-5.336-3.202C4.624 10.857 4.03 8.57 4.03 8.096c0-.254.101-.491.593-.491h1.744c.44 0 .61.203.779.677.863 2.49 2.303 4.675 2.896 4.675.22 0 .322-.101.322-.66V9.721c-.068-1.186-.695-1.287-.695-1.71 0-.203.169-.407.44-.407h2.744c.372 0 .508.203.508.643v3.473c0 .372.169.508.271.508.22 0 .407-.136.813-.542 1.253-1.405 2.151-3.574 2.151-3.574.119-.254.322-.491.762-.491h1.744c.525 0 .643.27.525.643-.22 1.017-2.354 4.031-2.354 4.031-.186.305-.254.44 0 .779.186.254.796.779 1.203 1.253.745.847 1.32 1.558 1.473 2.049.17.49-.085.745-.576.745z\"/></svg>Написать в Max</a>'
        +'<a class="btn-ghost" href="tel:+78006001838"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>Позвонить · 8 800 600-18-38</a>'
      +'</div>'
      +'<ul class="i-trust">'
        +'<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Договор с ООО «АТЛЕТ АВТО», фиксированная цена</li>'
        +'<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Проверка ЛКП и техники с фотоотчётом</li>'
        +'<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>Доставка по всей России</li>'
      +'</ul>'
    +'</div>'
  +'</div>';

  // gallery interactions
  if(imgs.length>1){
    var idx=0, main=document.getElementById('galImg'), count=document.getElementById('galCount'), thumbsEl=document.getElementById('galThumbs');
    function show(n){ idx=(n+imgs.length)%imgs.length; main.src=imgs[idx]; count.textContent=(idx+1)+' / '+imgs.length;
      thumbsEl.querySelectorAll('.gal-thumb').forEach(function(t,i){t.classList.toggle('active',i===idx);});
      var act=thumbsEl.querySelector('.gal-thumb.active'); if(act)act.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'}); }
    document.getElementById('galPrev').onclick=function(){show(idx-1);};
    document.getElementById('galNext').onclick=function(){show(idx+1);};
    thumbsEl.querySelectorAll('.gal-thumb').forEach(function(t){t.onclick=function(){show(+t.dataset.i);};});
    document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1);});
  }
})();
</script>
</body>
</html>
